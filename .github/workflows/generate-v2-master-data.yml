
name: Generate V2 Master Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate supplier and product data
        run: python v2/generate_master_data.py

      - name: Commit generated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/data/suppliers.csv v2/data/products.csv
          if ! git diff --cached --quiet; then
            git commit -m "Generate V2 supplier and product datasets"
            git push
          fi
