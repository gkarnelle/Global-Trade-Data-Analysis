
name: Archive V1 Master Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-v1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive and verify V1 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          root = Path(".")
          archive = root / "archive" / "v1"

          scripts = [
              "analysis.py",
              "compliance_screening.py",
              "dashboard.py",
              "generate_import_data.py",
              "tariff_analysis.py",
              "trade_compliance_dashboard.py",
              "trade_compliance_dashboard_v3.py",
          ]

          def sha256(path):
              return hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          def archive_copy(source, destination):
              destination.parent.mkdir(
                  parents=True, exist_ok=True
              )

              shutil.copy2(source, destination)

              assert sha256(source) == sha256(destination), (
                  f"Archive verification failed: {source}"
              )

              print(f"VERIFIED: {source} -> {destination}")

          print("=== ARCHIVING V1 SCRIPTS ===")

          for filename in scripts:
              source = root / filename

              if not source.is_file():
                  raise FileNotFoundError(
                      f"Required V1 script missing: {filename}"
                  )

              archive_copy(
                  source,
                  archive / "scripts" / filename
              )

          print("\n=== ARCHIVING V1 DATA AND ASSETS ===")

          for source in sorted(root.iterdir()):
              if not source.is_file():
                  continue

              suffix = source.suffix.lower()

              if suffix in {".csv", ".xlsx", ".xls"}:
                  category = "data"
              elif suffix in {
                  ".png", ".jpg", ".jpeg", ".svg",
                  ".html"
              }:
                  category = "dashboards"
              else:
                  continue

              archive_copy(
                  source,
                  archive / category / source.name
              )

          print("\n=== ARCHIVING OUTPUTS ===")

          outputs = root / "outputs"

          if outputs.is_dir():
              for source in sorted(outputs.rglob("*")):
                  if not source.is_file():
                      continue

                  relative = source.relative_to(outputs)

                  archive_copy(
                      source,
                      archive / "outputs" / relative
                  )

          print("\n=== FINAL VERIFICATION ===")

          for filename in scripts:
              source = root / filename
              destination = (
                  archive / "scripts" / filename
              )

              assert destination.is_file()
              assert sha256(source) == sha256(destination)

          print("All seven V1 scripts verified.")
          print("Original files remain unchanged.")
          print("V2 files were not modified.")
          PY

      - name: Commit verified archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive/v1/

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Complete and verify V1 master archive"
            git push
          fi
